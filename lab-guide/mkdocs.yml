site_name: "Snowflake CoWork Lab | SWT Auckland 2026"
nav:
  - Lab Guide:
      - index.md
      - getting_started.md
      - act1.md
      - act2.md
      - deep_research.md
      - take_action.md
      - bonus.md
      - wrap_up.md
site_url: ""
use_directory_urls: false
plugins:
  - search
  - glightbox
theme:
  name: material
  custom_dir: overrides
  features:
    - announce.dismiss
    - toc.integrate
    - content.tabs.link
    - content.code.copy
    - content.code.annotation
    - navigation.footer
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      primary: light-blue
      accent: blue
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
      primary: light-blue
      accent: light-blue

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.mark
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.blocks.html

extra_css:
  - stylesheets/extra.css
